[project]
name = "jarvis-gateway"
version = "0.0.0"
description = "JARVIS gateway (data plane)."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.156.5",
    "jarvis-core",
    "uvicorn==0.34.2",
    "uvloop==0.21.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_gateway"]

[tool.uv.sources]
jarvis-core = { workspace = true }
