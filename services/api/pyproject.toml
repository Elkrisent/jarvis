[project]
name = "jarvis-api"
version = "0.0.0"
description = "JARVIS control plane API."
requires-python = ">=3.12"
dependencies = ["jarvis-core"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_api"]

[tool.uv.sources]
jarvis-core = { workspace = true }
