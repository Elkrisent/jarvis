# Test override: publishes service ports on loopback so tests can reach them, and adds the
# mock upstream under the `test` profile.
# Compose profiles cannot change an existing service's ports, so the ports live in this override file.
#   docker compose -f docker-compose.yml -f docker-compose.test.yml --profile test --env-file .env.example up -d --wait
services:
  gateway:
    ports: ["127.0.0.1:18080:8080"]
  api:
    ports: ["127.0.0.1:18081:8080"]
    # Throwaway placeholders for the test stack only. The master key is 32 bytes of base64 that
    # spell "jarvis-test-master-key-placehold"; neither value protects anything.
    environment:
      JARVIS_MASTER_KEY: amFydmlzLXRlc3QtbWFzdGVyLWtleS1wbGFjZWhvbGQ=
      JARVIS_ADMIN_TOKEN: test-admin-token-placeholder-0000000000
  worker:
    ports: ["127.0.0.1:18082:8080"]

  mock-upstream:
    profiles: ["test"]
    image: jarvis-mock-upstream:dev
    build:
      context: ..
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE: mock-upstream
        APP_MODULE: mock_upstream.app:create_app_from_env
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    environment:
      MOCK_SEED: "${MOCK_SEED:-}"
    ports: ["127.0.0.1:19000:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/__admin/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
