# Extends the default gitleaks rules; only throwaway placeholders and made-up test fixtures are allowed.
[extend]
useDefault = true

[[allowlists]]
description = "Throwaway placeholder secrets for the test compose stack (protect nothing)"
condition = "AND"
regexes = [
  '''amFydmlzLXRlc3QtbWFzdGVyLWtleS1wbGFjZWhvbGQ=''',
]
paths = [
  '''deploy/docker-compose\.test\.yml''',
]

[[allowlists]]
description = "Made-up JARVIS key used as a fixture in the key-extraction unit tests (protects nothing)"
condition = "AND"
regexes = [
  '''jv_live_abc123''',
]
paths = [
  '''services/gateway/tests/unit/test_auth_extraction\.py''',
]

[[allowlists]]
description = "Made-up JARVIS key used as a fixture in the forwarder unit tests (protects nothing)"
condition = "AND"
regexes = [
  '''jv_live_forwarderkey1''',
]
paths = [
  '''services/gateway/tests/unit/test_forwarder\.py''',
]

[[allowlists]]
description = "Made-up JARVIS key used as a fixture in the telemetry overhead benchmark (protects nothing)"
condition = "AND"
regexes = [
  '''jv_live_benchtelemetry01''',
]
paths = [
  '''services/gateway/tests/bench/test_telemetry_overhead\.py''',
]

[[allowlists]]
description = "Throwaway provider credential in the first version of the S2 benchmark setup script (protects nothing; it now generates the value at run time)"
condition = "AND"
regexes = [
  '''sk-s2-bench-placeholder''',
]
paths = [
  '''scripts/bench/s2_setup\.py''',
]
