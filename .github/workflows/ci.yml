name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.17"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: make lint
      - run: make typecheck
      - run: make test-unit
